title: C3.5 — Pipeline Fine-Tuning
text: Pipeline Fine-Tuning
rationale: Fine-tuning pipelines are high-privilege operations that can alter deployed model
  behavior at scale. Multi-stage pipelines compound this risk because a compromise at any intermediate
  stage produces a subtly altered artifact that subsequent stages accept.
