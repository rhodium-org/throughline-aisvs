title: C12.2 — Detection and Alerting
text: Detection and Alerting
rationale: AI-specific attack patterns (jailbreak, prompt injection, model extraction, multi-turn
  trajectory attacks, covert channels over LLM endpoints) must be detected, and security events
  enriched with AI-specific context so downstream detection and response systems can act on
  them.
