title: C1.3 — Training Data Quality and Security Assurance
text: Training Data Quality and Security Assurance
rationale: Quality and security assurance controls help detect corruption, poisoning, labeling
  errors, and exploitable dataset patterns before they affect model behavior. Pipelines should
  combine automated validation, poisoning detection, label quality checks, and bias analysis.
