title: C2.2 — Content & Policy Screening
text: Content & Policy Screening
rationale: Syntactically valid prompts may still request disallowed content such as policy-violating
  instructions, harmful material, or restricted information. Input-side content screening prevents
  such prompts from reaching the model.
