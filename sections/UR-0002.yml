title: C1.2 — Data Labeling and Annotation Security
text: Data Labeling and Annotation Security
rationale: Labeling and annotation processes must be protected against unauthorized modification,
  data leakage, and integrity compromise. Annotation platforms should enforce access control,
  preserve auditability, and protect labeling artifacts and sensitive label content throughout
  the training pipeline.
